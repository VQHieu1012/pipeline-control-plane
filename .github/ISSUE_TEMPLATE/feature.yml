name: Feature
description: Product or engineering capability
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are we solving?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe inputs, outputs, or observable behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure cases
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
