[project]
name = "control-plane"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vu Quang Hieu", email = "vuquanghieuaz@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "apache-flink==2.2.1",
    "confluent-kafka>=2.15.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "kubernetes>=36.0.3",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "pyodbc>=5.3.0",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.1",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
control-plane = "control_plane:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
